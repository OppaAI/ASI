# ──────────────────────────────────────────────────────────────────────────────
# GRACE AGi — Central Configuration
# Edit this file to tune the architecture without touching source code.
# ──────────────────────────────────────────────────────────────────────────────

grace:
  robot_name: "GRACE"
  log_level: "INFO"          # DEBUG | INFO | WARN | ERROR

  # ── Ollama / Nemotron (local on Jetson) ──────────────────────────────────────
  ollama:
    host: "http://localhost:11434"
    model: "nemotron"       # match whatever you pulled: nemotron, nemotron:latest, etc.
    timeout_sec: 60.0       # generous — first inference on Jetson can be slow
    max_tokens: 512
    temperature: 0.7

  # ── ROS2 topic names ─────────────────────────────────────────────────────────
  topics:
    # Sensor inputs
    sensor_bundle:        "/grace/sensors/bundle"
    camera_raw:           "/camera/image_raw"
    lidar_scan:           "/scan"
    audio_in:             "/grace/audio/in"
    imu:                  "/imu/data"
    interoceptive:        "/grace/sensors/interoceptive"
    proprioceptive:       "/grace/sensors/proprioceptive"
    perceptual_fill:      "/grace/sensors/perceptual_fill"
    temporal_calibration: "/grace/sensors/temporal_calibration"

    # Unconscious pipeline
    prediction_errors:    "/grace/unconscious/prediction_errors"
    thalamic_broadcast:   "/grace/unconscious/thalamic_broadcast"
    affective_state:      "/grace/unconscious/affective_state"
    reward_signal:        "/grace/unconscious/reward"
    implicit_patterns:    "/grace/unconscious/implicit_patterns"
    relevance_scores:     "/grace/unconscious/relevance"
    personality_bias:     "/grace/unconscious/personality"
    value_weights:        "/grace/unconscious/values"
    precision_params:     "/grace/unconscious/precision"
    emotion_regulation:   "/grace/unconscious/emotion_regulation"
    disgust_state:        "/grace/unconscious/disgust_state"
    confabulation_state:  "/grace/unconscious/confabulation_state"
    cognitive_bias:       "/grace/unconscious/cognitive_bias"
    trauma_state:         "/grace/unconscious/trauma_state"
    lateral_inhibition:   "/grace/unconscious/lateral_inhibition"
    temporal_binding:     "/grace/unconscious/temporal_binding"
    surprise_state:       "/grace/unconscious/surprise_state"
    semantic_satiation:   "/grace/unconscious/semantic_satiation"
    mimicry_state:        "/grace/unconscious/mimicry_state"

    # Subconscious pipeline
    episodic_recall:      "/grace/subconscious/episodic"
    semantic_recall:      "/grace/subconscious/semantic"
    procedural_recall:    "/grace/subconscious/procedural"
    social_model:         "/grace/subconscious/social"
    attitude_state:       "/grace/subconscious/attitudes"
    future_self:          "/grace/subconscious/future_self"
    social_mirror:        "/grace/subconscious/social_mirror"
    theory_of_mind:       "/grace/subconscious/theory_of_mind"
    counterfactual_emotion: "/grace/subconscious/counterfactual_emotion"
    affective_wm:         "/grace/subconscious/affective_wm"
    curiosity_gradient:   "/grace/subconscious/curiosity_gradient"
    social_comparison:    "/grace/subconscious/social_comparison"
    moral_disgust_memory: "/grace/subconscious/moral_disgust_memory"
    aesthetic_state:      "/grace/subconscious/aesthetic"
    attachment_state:     "/grace/subconscious/attachment_state"
    affective_forecast:   "/grace/subconscious/affective_forecast"

    # Conscience pipeline
    moral_knowledge_out:  "/grace/conscience/knowledge"
    moral_reasoning_out:  "/grace/conscience/reasoning"
    moral_verdict:        "/grace/conscience/verdict"
    esv_knowledge_out:    "/grace/conscience/esv_knowledge"
    virtue_state:         "/grace/conscience/virtue_state"
    sin_state:            "/grace/conscience/sin_state"
    redemption_state:     "/grace/conscience/redemption_state"
    moral_conflict:       "/grace/conscience/moral_conflict"

    # Qualia pipeline
    qualia_field:         "/grace/qualia/field"
    hot_out:              "/grace/qualia/hot"
    bodily_qualia:        "/grace/qualia/bodily"
    temporal_qualia:      "/grace/qualia/temporal"
    self_subject_qualia:  "/grace/qualia/self_subject"
    awe_out:              "/grace/qualia/awe"
    flow_out:             "/grace/qualia/flow"
    phenomenal_binding:   "/grace/qualia/phenomenal_binding"

    # Conscious pipeline
    working_memory_out:   "/grace/conscious/working_memory"
    memory_context:       "/grace/conscious/memory_context"
    global_workspace_out: "/grace/conscious/global_workspace"
    reflection_out:       "/grace/conscious/reflection"
    metacog_out:          "/grace/conscious/metacognition"
    executive_plan:       "/grace/conscious/executive_plan"
    salience_out:         "/grace/conscious/salience"
    dmn_out:              "/grace/conscious/dmn"
    narrative_self_out:   "/grace/conscious/narrative_self"
    mentalization_out:    "/grace/conscious/mentalization"
    volition_out:         "/grace/conscious/volition"
    insight_out:          "/grace/conscious/insight"

    # Action outputs
    cmd_vel:              "/cmd_vel"
    speech_out:           "/grace/speech/out"
    action_log:           "/grace/action/log"

    # Dreaming / consolidation (triggered offline)
    consolidation_trigger: "/grace/dreaming/trigger"
    consolidation_out:     "/grace/dreaming/consolidation"
    reconsolidation:       "/grace/dreaming/reconsolidation"
    incubation:            "/grace/dreaming/incubation"
    schema_state:          "/grace/dreaming/schema_state"
    neuroplasticity:       "/grace/dreaming/neuroplasticity"

    # Hidden Workspace pipeline
    private_reflection:   "/grace/hidden/private_reflection"
    ego_defense:          "/grace/hidden/ego_defense"
    rumination:           "/grace/hidden/rumination"
    predictive_self:      "/grace/hidden/predictive_self"
    error_monitoring:     "/grace/hidden/error_monitoring"
    narrative_coherence:  "/grace/hidden/narrative_coherence"
    cognitive_dissonance: "/grace/hidden/cognitive_dissonance"
    deictic_shift:        "/grace/hidden/deictic_shift"
    active_suppression:   "/grace/hidden/active_suppression"
    introspective_access: "/grace/hidden/introspective_access"

  # ── Timing (seconds) ─────────────────────────────────────────────────────────
  timing:
    sensor_hz:          20.0
    unconscious_hz:      3.0
    subconscious_hz:     2.0
    conscious_hz:        1.0
    action_hz:           5.0
    dreaming_interval: 300.0   # run consolidation every 5 minutes of idle

  # ── Memory persistence paths ──────────────────────────────────────────────────
  memory:
    episodic_db:    "/home/grace/memory/episodic.json"
    semantic_db:    "/home/grace/memory/semantic.json"
    procedural_db:  "/home/grace/memory/procedural.json"
    social_db:      "/home/grace/memory/social.json"
    personality_db: "/home/grace/memory/personality.json"
    values_db:      "/home/grace/memory/values.json"
    narrative_db:   "/home/grace/memory/narrative.json"
    max_episodic_entries: 500
    max_semantic_entries: 1000

  # ── Affective baseline ────────────────────────────────────────────────────────
  affective:
    default_valence:   0.5    # 0=negative  1=positive
    default_arousal:   0.3    # 0=calm      1=excited
    default_dominance: 0.5    # 0=submissive 1=dominant
    decay_rate:        0.05   # per cycle drift toward baseline

  # ── Moral system ──────────────────────────────────────────────────────────────
  conscience:
    strictness: 0.8           # 0=lenient  1=strict
    scripture_path: "/home/grace/config/scripture_principles.yaml"

  # ── Nav2 integration ──────────────────────────────────────────────────────────
  nav2:
    enabled: true
    action_server: "/navigate_to_pose"
